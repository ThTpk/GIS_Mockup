<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบการออกแบบ — GeoCore GIS</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .sw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; }
  .sw-card { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface-1); }
  .sw-card .chip-c { height: 56px; }
  .sw-card .meta { padding: 8px 10px; font-size: .72rem; }
  .sw-card .meta b { display: block; font-size: .78rem; }
  .ramp { display: flex; border-radius: var(--r-sm); overflow: hidden; height: 38px; }
  .ramp span { flex: 1; display: grid; place-items: end center; font-size: .58rem; padding-bottom: 3px; color: #fff; }
  .spec { display: grid; grid-template-columns: 170px 1fr; gap: 8px 14px; font-size: .84rem; align-items: baseline; }
  .spec dt { color: var(--ink-3); }
  .demo { border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; background: var(--surface-2); }
</style>
</head>
<body>
<main class="content"><div class="content-inner" id="root"></div></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/shell.js"></script>
<script>
renderShell('design-system.html');
const root = document.getElementById('root');

const SERIES = [
  ['--s1', 'ฟ้า', 'ชั้นข้อมูลถนน · ค่าหลัก'], ['--s2', 'ส้ม', 'สะพาน · การส่งออก'],
  ['--s3', 'เขียวน้ำทะเล', 'แหล่งน้ำ · ค่าที่ผ่านเกณฑ์'], ['--s4', 'เหลือง', 'ไฟส่องสว่าง'],
  ['--s5', 'ชมพู', 'ทางระบายน้ำ'], ['--s6', 'เขียว', 'พื้นที่สาธารณะ'],
  ['--s7', 'ม่วง', 'CCTV · ผู้ดูแลระบบ'], ['--s8', 'แดง', 'แนวเขต']
];
const STATUS = [
  ['--good', 'ผ่านเกณฑ์ / อนุมัติแล้ว'], ['--warning', 'เตือน / รอดำเนินการ'],
  ['--serious', 'สำคัญ / ต้องแก้ไข'], ['--critical', 'วิกฤต / ตีกลับ']
];

root.innerHTML = `
${pageHead({
  crumbs: ['<a href="index.html">หน้าแรก</a>', 'ระบบการออกแบบ'],
  title: 'ระบบการออกแบบ (Design System)',
  sub: 'สี ตัวอักษร ระยะห่าง และองค์ประกอบหน้าจอที่ใช้ร่วมกันทั้งระบบ พร้อมเกณฑ์การเข้าถึงและการแสดงผลบนมือถือ',
  actions: `<button class="btn" data-theme-toggle2>${icon('moon')} สลับธีมทดสอบ</button>`
})}

<div class="notice notice-info mb16">${icon('info')}<div>
  <strong>ทำไมต้องมีระบบการออกแบบ</strong>
  ระบบนี้มีหน้าจอมากกว่า 20 หน้า และจะมีหน้าจอเพิ่มขึ้นในระยะยาว
  การกำหนดสี ตัวอักษร และองค์ประกอบไว้เป็นชุดเดียวทำให้หน้าจอใหม่ที่พัฒนาภายหลังหน้าตาสอดคล้องกัน
  ลดเวลาพัฒนา และทำให้เจ้าหน้าที่เรียนรู้หน้าจอใหม่ได้เร็วขึ้นเพราะองค์ประกอบทำงานเหมือนเดิมทุกหน้า</div>

<div class="tabs" data-tabs>
  <button data-tab="c" aria-selected="true">สี</button>
  <button data-tab="t" aria-selected="false">ตัวอักษรและระยะห่าง</button>
  <button data-tab="e" aria-selected="false">องค์ประกอบหน้าจอ</button>
  <button data-tab="a" aria-selected="false">การเข้าถึงและมือถือ</button>
</div>

<div class="tabpanel" data-panel="c">
  <div class="card mb16">
    <div class="card-head"><h2>สีสำหรับชั้นข้อมูลและกราฟ</h2><span class="spacer"></span>
      <span class="hint">ลำดับสีคงที่ ไม่หมุนเวียน</span></div>
    <div class="card-body">
      <div class="sw-grid" id="series"></div>
      <div class="notice notice-good mt16">${icon('check')}<div>
        <strong>ผ่านการตรวจสอบการมองเห็นสี</strong>
        ลำดับสีชุดนี้ผ่านเกณฑ์การแยกแยะสำหรับผู้มีภาวะตาบอดสีทั้งแบบ protan, deutan และ tritan
        (ค่าความต่างของคู่สีที่อยู่ติดกัน ≥ 8 ในปริภูมิ OKLab) และผ่านเกณฑ์ความต่างสำหรับผู้มองเห็นสีปกติ ≥ 15
        ทั้งในธีมสว่างและธีมมืด</div></div>
      <p class="small muted mt16" style="margin-bottom:0">สีที่มีความต่างจากพื้นหลังต่ำกว่า 3:1
        (เขียวน้ำทะเล เหลือง ชมพู ในธีมสว่าง) ใช้ควบคู่กับป้ายตัวเลขหรือคำอธิบายเสมอ
        ไม่ใช้สีเพียงอย่างเดียวสื่อความหมาย</p>
    </div>
  </div>

  <div class="grid g2 mb16">
    <div class="card"><div class="card-head"><h2>สีสถานะ</h2></div>
      <div class="card-body">
        <div class="sw-grid" id="status"></div>
        <p class="small muted mt16" style="margin-bottom:0">สีสถานะสงวนไว้สำหรับสื่อสถานะเท่านั้น
          ไม่นำไปใช้เป็นสีของชั้นข้อมูลหรือชุดข้อมูลในกราฟ และแสดงคู่กับไอคอนและข้อความเสมอ</p>
        <div class="row mt16">
          <span class="badge badge-good">${icon('check')} อนุมัติแล้ว</span>
          <span class="badge badge-warning">รอตรวจสอบ</span>
          <span class="badge badge-serious">สำคัญ</span>
          <span class="badge badge-critical">${icon('warn')} วิกฤต</span>
          <span class="badge badge-outline">ร่าง</span>
          <span class="badge badge-info">ข้อมูล</span>
        </div>
      </div></div>

    <div class="card"><div class="card-head"><h2>ลำดับความเข้มสำหรับค่าต่อเนื่อง</h2></div>
      <div class="card-body">
        <p class="small dim mb8">ใช้กับแผนที่ความหนาแน่นและกราฟที่แสดงปริมาณ — สีเดียวไล่จากอ่อนไปเข้ม
          ไม่ใช้สีรุ้งซึ่งทำให้อ่านลำดับผิด</p>
        <div class="ramp mb16" id="ramp"></div>
        <h3 style="font-size:.86rem;margin-bottom:6px">สีพื้นหลังและตัวอักษร</h3>
        <div class="sw-grid" id="neutral"></div>
      </div></div>
  </div>

  <div class="card">
    <div class="card-head"><h2>สีของชั้นข้อมูลบนแผนที่</h2></div>
    <div class="table-wrap">
      <table class="tbl compact">
        <thead><tr><th style="width:40px">สัญลักษณ์</th><th>ชั้นข้อมูล</th><th>รูปทรง</th><th>ตัวแปรสี</th><th>เหตุผลที่เลือกสีนี้</th></tr></thead>
        <tbody id="layerColors"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="tabpanel" data-panel="t" hidden>
  <div class="grid g2">
    <div class="card"><div class="card-head"><h2>ตัวอักษร</h2></div>
      <div class="card-body">
        <dl class="spec mb16">
          <dt>แบบอักษรหลัก</dt><dd>IBM Plex Sans Thai — รองรับภาษาไทยและละตินในชุดเดียว
            มีน้ำหนัก 400–700 และอ่านง่ายในขนาดเล็ก</dd>
          <dt>แบบอักษรโค้ด</dt><dd>IBM Plex Mono — ใช้กับรหัสรายการ ชื่อฟิลด์ และตัวอย่างคำสั่ง</dd>
          <dt>ขนาดฐาน</dt><dd>15 px (จอใหญ่) · 14.5 px (จอเล็กกว่า 680 px)</dd>
          <dt>ความสูงบรรทัด</dt><dd>1.6 สำหรับเนื้อความ · 1.3 สำหรับหัวเรื่อง</dd>
          <dt>ตัวเลขในตาราง</dt><dd>ใช้ <code>tabular-nums</code> เพื่อให้หลักตรงกันทุกแถว</dd>
        </dl>
        <div class="demo">
          <div style="font-size:1.5rem;font-weight:600;letter-spacing:-.01em">หัวเรื่องหน้า — 24 px / 600</div>
          <div style="font-size:1.15rem;font-weight:600;margin-top:8px">หัวเรื่องการ์ด — 18 px / 600</div>
          <div style="font-size:.95rem;font-weight:600;margin-top:8px">หัวเรื่องย่อย — 15 px / 600</div>
          <div style="margin-top:8px">เนื้อความปกติ — 15 px / 400 ใช้กับคำอธิบายและเนื้อหาทั่วไปในระบบ</div>
          <div class="small" style="margin-top:8px">ข้อความรอง — 13.5 px ใช้กับคำอธิบายใต้ฟิลด์และข้อมูลประกอบ</div>
          <div class="xsmall muted" style="margin-top:8px">ข้อความกำกับ — 12 px ใช้กับป้ายกำกับและหมายเหตุ</div>
          <div class="mono small" style="margin-top:8px">RD-0101 · feature_code — IBM Plex Mono</div>
        </div>
      </div></div>

    <div class="card"><div class="card-head"><h2>ระยะห่างและมุมโค้ง</h2></div>
      <div class="card-body">
        <dl class="spec mb16">
          <dt>หน่วยระยะห่าง</dt><dd>ทวีคูณของ 4 px — ใช้ 4, 6, 8, 10, 13, 16, 22, 24, 34 px</dd>
          <dt>ระยะในการ์ด</dt><dd>16 px (จอใหญ่) · 13 px (มือถือ)</dd>
          <dt>ระยะขอบเนื้อหา</dt><dd>24 px → 16 px → 13 px ตามความกว้างหน้าจอ</dd>
          <dt>ความกว้างสูงสุด</dt><dd>1,320 px — ป้องกันบรรทัดยาวเกินไปบนจอกว้าง</dd>
          <dt>มุมโค้ง</dt><dd>4 / 6 / 10 / 14 / 20 px และวงกลมเต็มสำหรับป้ายกำกับ</dd>
          <dt>เส้นขอบ</dt><dd>1 px เส้นบาง ใช้แทนเงาในกรณีส่วนใหญ่ เพื่อให้หน้าจอดูสงบ</dd>
          <dt>เงา</dt><dd>3 ระดับ — การ์ด (บาง) · เมนูลอย (กลาง) · หน้าต่างซ้อน (หนา)</dd>
        </dl>
        <div class="demo">
          <div class="row">
            ${[4, 6, 10, 14, 20].map(r => `<div style="text-align:center">
              <div style="width:52px;height:52px;background:var(--b400);border-radius:${r}px"></div>
              <div class="xsmall muted" style="margin-top:4px">${r} px</div></div>`).join('')}
          </div>
        </div>
      </div></div>
  </div>
</div>

<div class="tabpanel" data-panel="e" hidden>
  <div class="grid g2">
    <div class="card"><div class="card-head"><h2>ปุ่ม</h2></div>
      <div class="card-body">
        <div class="demo">
          <div class="row mb16">
            <button class="btn btn-primary">บันทึกข้อมูล</button>
            <button class="btn">ยกเลิก</button>
            <button class="btn btn-ghost">ดูเพิ่มเติม</button>
            <button class="btn btn-danger">ตีกลับ</button>
            <button class="btn" disabled>ปิดการใช้งาน</button>
          </div>
          <div class="row mb16">
            <button class="btn btn-sm">ปุ่มเล็ก</button>
            <button class="btn btn-lg btn-primary">ปุ่มใหญ่</button>
            <button class="btn">${icon('download')} มีไอคอน</button>
          </div>
          <div class="segmented">
            <button aria-pressed="true">แผนที่</button><button>ตาราง</button><button>กราฟ</button>
          </div>
        </div>
        <dl class="spec mt16">
          <dt>ปุ่มหลัก</dt><dd>หนึ่งปุ่มต่อหนึ่งหน้าจอ — การกระทำที่ผู้ใช้มาเพื่อทำ</dd>
          <dt>ปุ่มอันตราย</dt><dd>ใช้กับการกระทำที่ย้อนกลับยาก และต้องมีหน้าต่างยืนยันเสมอ</dd>
          <dt>ความสูงปุ่ม</dt><dd>34 px ปกติ · 28 px เล็ก · 42 px ใหญ่ — ทุกขนาดมีพื้นที่สัมผัส ≥ 44 px บนมือถือ</dd>
        </dl>
      </div></div>

    <div class="card"><div class="card-head"><h2>ฟอร์ม</h2></div>
      <div class="card-body">
        <div class="demo">
          <div class="field"><label>ชื่อรายการ <span class="req">*</span></label>
            <input type="text" placeholder="กรอกชื่อรายการ">
            <div class="hint">คำอธิบายเพิ่มเติมใต้ฟิลด์</div></div>
          <div class="field"><label>ฟิลด์ที่ยังไม่ผ่านการตรวจ <span class="req">*</span></label>
            <input type="text" class="invalid" value="">
            <div class="err">${icon('warn')} ต้องระบุหลักฐานอ้างอิง (กฎ QC-01)</div></div>
          <label class="check"><input type="checkbox" checked><span>ตัวเลือกแบบติ๊ก</span></label>
          <label class="check" style="margin-bottom:0">
            <span class="switch"><input type="checkbox" checked><span class="track"></span><span class="knob"></span></span>
            <span>สวิตช์เปิด/ปิด</span></label>
        </div>
        <dl class="spec mt16">
          <dt>ฟิลด์บังคับ</dt><dd>กำกับด้วยเครื่องหมาย * สีแดง ไม่ใช้สีเพียงอย่างเดียว</dd>
          <dt>ข้อผิดพลาด</dt><dd>แสดงใต้ฟิลด์ พร้อมไอคอนและรหัสกฎที่ไม่ผ่าน เพื่อให้เจ้าหน้าที่อ้างอิงคู่มือได้</dd>
          <dt>การตรวจค่า</dt><dd>ตรวจขณะพิมพ์สำหรับรูปแบบ และตรวจซ้ำที่เซิร์ฟเวอร์ก่อนบันทึกเสมอ</dd>
        </dl>
      </div></div>

    <div class="card"><div class="card-head"><h2>ตาราง</h2></div>
      <div class="card-body">
        <div class="table-wrap demo" style="padding:0">
          <table class="tbl compact">
            <thead><tr><th>รหัส</th><th>ชื่อ</th><th class="num">ความยาว</th><th>สถานะ</th></tr></thead>
            <tbody>
              <tr><td class="mono">RD-0101</td><td>ถนนสายหลักกลางตำบล</td><td class="num">4,820</td>
                <td><span class="badge badge-good">อนุมัติแล้ว</span></td></tr>
              <tr><td class="mono">RD-0163</td><td>ซอยริมคลองสาธารณะ 7</td><td class="num">410</td>
                <td><span class="badge badge-critical">ข้อมูลขัดแย้ง</span></td></tr>
            </tbody>
          </table>
        </div>
        <dl class="spec mt16">
          <dt>หัวตาราง</dt><dd>ตรึงไว้ด้านบนเมื่อเลื่อน · ตัวพิมพ์เล็กและสีจาง เพื่อให้ข้อมูลเด่นกว่าหัวตาราง</dd>
          <dt>ตัวเลข</dt><dd>ชิดขวาและใช้ตัวเลขความกว้างเท่ากัน</dd>
          <dt>บนมือถือ</dt><dd>เลื่อนตารางในแนวนอน ไม่บีบคอลัมน์จนอ่านไม่ออก</dd>
        </dl>
      </div></div>

    <div class="card"><div class="card-head"><h2>การแจ้งเตือนและป้ายกำกับ</h2></div>
      <div class="card-body">
        <div class="notice notice-info mb8">${icon('info')}<div><strong>ข้อมูลประกอบ</strong>คำอธิบายเพิ่มเติมที่ไม่ต้องดำเนินการ</div></div>
        <div class="notice notice-good mb8">${icon('check')}<div><strong>สำเร็จ</strong>การทำงานเสร็จสมบูรณ์</div></div>
        <div class="notice notice-warn mb8">${icon('warn')}<div><strong>ควรตรวจสอบ</strong>ดำเนินการต่อได้ แต่มีข้อควรระวัง</div></div>
        <div class="notice notice-crit mb16">${icon('warn')}<div><strong>ต้องแก้ไข</strong>ดำเนินการต่อไม่ได้จนกว่าจะแก้ไข</div></div>
        <div class="row">
          <button class="btn btn-sm" onclick="toast('ตัวอย่างข้อความแจ้งผลการทำงาน','check')">ทดสอบข้อความแจ้งผล</button>
          <button class="btn btn-sm" onclick="modal('ตัวอย่างหน้าต่างซ้อน','<p class=\\'small dim\\'>ใช้กับการยืนยันการกระทำที่ย้อนกลับยาก และฟอร์มสั้น ๆ ที่ไม่ควรเปลี่ยนหน้า</p>','<button class=\\'btn\\' data-close>ปิด</button>')">ทดสอบหน้าต่างซ้อน</button>
        </div>
      </div></div>
  </div>
</div>

<div class="tabpanel" data-panel="a" hidden>
  <div class="grid g2">
    <div class="card"><div class="card-head"><h2>เกณฑ์การเข้าถึง</h2></div>
      <div class="table-wrap"><table class="tbl compact">
        <thead><tr><th style="width:180px">หัวข้อ</th><th>เกณฑ์ที่ใช้</th></tr></thead>
        <tbody>
          <tr><td>ความต่างของสีตัวอักษร</td><td class="small">อย่างน้อย 4.5:1 สำหรับเนื้อความ และ 3:1 สำหรับตัวอักษรขนาดใหญ่ (WCAG 2.2 AA)</td></tr>
          <tr><td>การสื่อความหมาย</td><td class="small">ไม่ใช้สีเพียงอย่างเดียว — ทุกสถานะมีไอคอนและข้อความกำกับ</td></tr>
          <tr><td>การใช้งานด้วยแป้นพิมพ์</td><td class="small">ทุกปุ่มและฟิลด์เข้าถึงด้วย Tab ได้ และมีกรอบแสดงตำแหน่งโฟกัสชัดเจน</td></tr>
          <tr><td>โปรแกรมอ่านหน้าจอ</td><td class="small">ใช้ป้ายกำกับ aria สำหรับปุ่มไอคอน และคำอธิบายกราฟทุกรูป</td></tr>
          <tr><td>ขนาดพื้นที่สัมผัส</td><td class="small">อย่างน้อย 44 × 44 px บนอุปกรณ์สัมผัส</td></tr>
          <tr><td>การย่อ/ขยายหน้าจอ</td><td class="small">อ่านได้ที่การขยาย 200% โดยไม่มีการเลื่อนในแนวนอน</td></tr>
          <tr><td>ธีมมืด</td><td class="small">กำหนดค่าสีแยกต่างหาก ไม่กลับสีอัตโนมัติ และตรวจความต่างของสีใหม่ทั้งชุด</td></tr>
          <tr><td>กราฟ</td><td class="small">ทุกกราฟมีป้ายตัวเลขกำกับและเปิดดูเป็นตารางข้อมูลได้</td></tr>
        </tbody></table></div>
    </div>
    <div class="card"><div class="card-head"><h2>การแสดงผลตามขนาดหน้าจอ</h2></div>
      <div class="table-wrap"><table class="tbl compact">
        <thead><tr><th style="width:130px">ความกว้าง</th><th>อุปกรณ์</th><th>การปรับหน้าจอ</th></tr></thead>
        <tbody>
          <tr><td class="mono small">≥ 1180 px</td><td class="small">จอคอมพิวเตอร์</td>
            <td class="small">เมนูข้างคงที่ · การ์ด 4 คอลัมน์ · แผนที่พร้อมแผงชั้นข้อมูลด้านข้าง</td></tr>
          <tr><td class="mono small">980–1180 px</td><td class="small">โน้ตบุ๊กจอเล็ก</td>

          <tr><td class="mono small">860–980 px</td><td class="small">แท็บเล็ตแนวนอน</td>
            <td class="small">แผงชั้นข้อมูลย้ายไปอยู่เหนือแผนที่</td></tr>
          <tr><td class="mono small">680–860 px</td><td class="small">แท็บเล็ตแนวตั้ง</td>
            <td class="small">เมนูข้างยุบเป็นเมนูแบบดึงออก · ปุ่มเมนูปรากฏบนแถบบน</td></tr>
          <tr><td class="mono small">&lt; 680 px</td><td class="small">โทรศัพท์มือถือ</td>
            <td class="small">การ์ดเรียงคอลัมน์เดียว · ตารางเลื่อนแนวนอน · ปุ่มเต็มความกว้าง ·
              หน้าต่างรายละเอียดบนแผนที่ย้ายมาอยู่ใต้แผนที่</td></tr>
          <tr><td class="mono small">&lt; 420 px</td><td class="small">มือถือจอเล็ก</td>
            <td class="small">ลดระยะห่างและขนาดปุ่มลงอีกขั้น · ซ่อนช่องค้นหาบนแถบบน</td></tr>
        </tbody></table></div>
      <div class="card-foot">ทดสอบโดยย่อความกว้างหน้าต่างเบราว์เซอร์ หรือเปิดหน้าใดก็ได้บนโทรศัพท์</div>
    </div>
  </div>

  <div class="card mt16">
    <div class="card-head"><h2>หลักการออกแบบหน้าจอ 6 ข้อ</h2></div>
    <div class="card-body">
      <div class="cov">
        <div class="c"><div class="h"><span class="n">1</span>บอกสถานะข้อมูลเสมอ</div>
          <p>ทุกรายการแสดงสถานะการอนุมัติและสถานะการยืนยันเจ้าของ เจ้าหน้าที่จึงรู้ได้ทันทีว่าข้อมูลที่เห็นเชื่อถือได้เพียงใด</p></div>
        <div class="c"><div class="h"><span class="n">2</span>แยกสิ่งที่รู้ออกจากสิ่งที่ยังไม่ยืนยัน</div>
          <p>ไม่เติมค่าแทนผู้ใช้เมื่อข้อมูลยังไม่ยุติ ใช้สถานะ "รอยืนยัน" และ "ข้อมูลขัดแย้ง" แทนการเดา</p></div>
        <div class="c"><div class="h"><span class="n">3</span>บอกเหตุผลเมื่อห้ามทำ</div>
          <p>ปุ่มที่ใช้ไม่ได้มีคำอธิบายว่าเพราะสิทธิ์ สถานะ หรือข้อมูลยังไม่ครบ ไม่ปล่อยให้ผู้ใช้เดาเอง</p></div>
        <div class="c"><div class="h"><span class="n">4</span>ตรวจค่าตั้งแต่ตอนกรอก</div>
          <p>แสดงผลการตรวจคุณภาพในฟอร์มทันที ลดการแก้งานย้อนหลังและลดภาระผู้ตรวจสอบ</p></div>
        <div class="c"><div class="h"><span class="n">5</span>ทำงานบนมือถือได้จริง</div>
          <p>หน้าจอสำรวจภาคสนามออกแบบสำหรับการใช้มือเดียวกลางแดด ปุ่มใหญ่ ความต่างของสีสูง และทำงานออฟไลน์</p></div>
        <div class="c"><div class="h"><span class="n">6</span>ทุกการกระทำตรวจสอบย้อนหลังได้</div>
          <p>การแก้ไข อนุมัติ ส่งออก และเผยแพร่ บันทึกพร้อมผู้กระทำและเวลา และเปิดดูได้จากหน้าจอโดยไม่ต้องขอจากผู้ดูแลระบบ</p></div>
      </div>
    </div>
  </div>
</div>
`;

initTabs();

function cssVal(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function swatches(list, el) {
  document.getElementById(el).innerHTML = list.map(s => `
    <div class="sw-card">
      <div class="chip-c" style="background:var(${s[0]})"></div>
      <div class="meta"><b>${s[1]}</b><span class="mono muted">${s[0]}</span><br>
        <span class="muted">${s[2] || ''}</span></div>
    </div>`).join('');
}
swatches(SERIES, 'series');
swatches(STATUS.map(s => [s[0], s[1].split(' / ')[0], s[1]]), 'status');
swatches([
  ['--plane', 'พื้นหลังหน้า', '--plane'], ['--surface-1', 'พื้นการ์ด', '--surface-1'],
  ['--surface-2', 'พื้นรอง', '--surface-2'], ['--line', 'เส้นขอบ', '--line'],
  ['--ink-1', 'ตัวอักษรหลัก', '--ink-1'], ['--ink-3', 'ตัวอักษรจาง', '--ink-3']
], 'neutral');

document.getElementById('ramp').innerHTML =
  ['--b100', '--b200', '--b300', '--b400', '--b500', '--b600', '--b700']
    .map(v => `<span style="background:var(${v});color:${['--b100','--b200','--b300'].includes(v) ? '#0b0b0b' : '#fff'}">${v.replace('--b', '')}</span>`).join('');

const REASON = {

  L03: 'สีม่วงแยกชัดจากทรัพย์สินอื่น และไม่ชนกับสีสถานะ',
  L04: 'สีส้มเด่นในพื้นที่จุดน้อย ทำให้มองเห็นได้แม้ย่อแผนที่',
  L05: 'สีเขียวน้ำทะเลสื่อถึงน้ำโดยไม่ชนกับสีพื้นที่สีเขียว',
  L06: 'สีชมพูแยกจากแหล่งน้ำได้ชัด ทั้งที่เป็นเรื่องน้ำเหมือนกัน',
  L07: 'สีเขียวสื่อถึงพื้นที่เปิดโล่งและพื้นที่สีเขียว',
  L08: 'สีแดงใช้กับแนวเขตที่ต้องให้ความสนใจเป็นพิเศษ',
  L09: 'สีเทาจาง เพราะเป็นชั้นข้อมูลพื้นหลังที่ไม่ควรแย่งความสนใจ',
  L10: 'สีเทาเข้ม แยกจากแปลงที่ดินแต่ยังเป็นชั้นข้อมูลพื้นหลัง'
};
document.getElementById('layerColors').innerHTML = LAYERS.map(l => `<tr>
  <td>${symbolSwatch(l)}</td>
  <td><b>${l.code}</b> ${l.name}</td>
  <td class="small">${l.geom}</td>
  <td class="mono small">${l.color.replace('var(', '').replace(')', '')}</td>

document.querySelector('[data-theme-toggle2]').onclick = () =>
  setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
</script>
