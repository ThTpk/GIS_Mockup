<div class="tabpanel" data-panel="f" hidden>

          <tr><td class="small">อยู่ในพื้นที่คลาดเคลื่อนของแนวเขต</td>
            <td><code class="small">S_WITHIN(geom, boundary_discrepancy('BD-01'))</code></td></tr>

      <div class="card-foot">ไวยากรณ์ตามมาตรฐาน OGC CQL2-Text ระบบแปลงเป็นเงื่อนไข SQL

      <div class="card-body" style="padding-top:12px">
        <div class="code-head">curl — ดึงถนนที่ต้องซ่อมในกรอบแผนที่</div>
<pre class="code dark">curl -G <span class="s">"https://&lt;host&gt;/api/v1/layers/L01/features"</span> \\
  -H <span class="s">"Authorization: Bearer &lt;ACCESS_TOKEN&gt;"</span> \\
  --data-urlencode <span class="s">"bbox=101.2184,12.8014,101.3127,12.8906"</span> \\
  --data-urlencode <span class="s">"filter=condition_code='needs_repair'"</span> \\
  --data-urlencode <span class="s">"fields=feature_code,name_th,length_m,owner_agency_id"</span> \\
  --data-urlencode <span class="s">"geometry=none"</span> \\
  --data-urlencode <span class="s">"limit=200"</span></pre>
        <div class="code-head" style="margin-top:14px">Python — สรุปความยาวถนนรายหน่วยงาน</div>
<pre class="code dark"><span class="k">import</span> requests, collections

<span class="t">BASE</span> = <span class="s">"https://&lt;host&gt;/api/v1"</span>
<span class="t">H</span> = {<span class="s">"Authorization"</span>: <span class="s">"Bearer &lt;ACCESS_TOKEN&gt;"</span>}

total, cursor = collections.Counter(), <span class="k">None</span>
<span class="k">while True</span>:
    p = {<span class="s">"limit"</span>: <span class="n">500</span>, <span class="s">"geometry"</span>: <span class="s">"none"</span>,
         <span class="s">"fields"</span>: <span class="s">"owner_agency_id,length_m"</span>}
    <span class="k">if</span> cursor: p[<span class="s">"cursor"</span>] = cursor
    r = requests.get(<span class="k">f</span><span class="s">"{BASE}/layers/L01/features"</span>, headers=H, params=p).json()
    <span class="k">for</span> f <span class="k">in</span> r[<span class="s">"features"</span>]:
        total[f[<span class="s">"properties"</span>][<span class="s">"owner_agency_id"</span>]] += f[<span class="s">"properties"</span>][<span class="s">"length_m"</span>]
    cursor = r.get(<span class="s">"next_cursor"</span>)
    <span class="k">if not</span> cursor: <span class="k">break</span>

<span class="k">for</span> agency, metres <span class="k">in</span> total.most_common():
    <span class="k">print</span>(agency, <span class="k">round</span>(metres / <span class="n">1000</span>, <span class="n">1</span>), <span class="s">"กม."</span>)</pre>
      </div></div>
  </div>
</div>

          <tr><td>การป้องกัน SQL injection</td><td class="small">คำสั่งแบบ parameterized ทุกกรณี · CQL2 แปลงผ่านตัวแยกวิเคราะห์ ไม่ต่อสตริง</td></tr>
          <tr><td>การอัปโหลดไฟล์</td><td class="small">จำกัด 15 MB · ตรวจชนิดไฟล์จริงจาก magic number · สแกนไวรัสก่อนจัดเก็บ</td></tr>
