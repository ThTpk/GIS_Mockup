  .sc-sum svg { width: 15px; height: 15px; flex: 0 0 15px; color: var(--ink-3); }

/* ---------- ตัวช่วยแสดงผล ---------- */
function rolePills(codes) {
  return codes.map(c => `<span class="badge badge-outline" title="${ROLES[c].en}">
    <span style="width:7px;height:7px;border-radius:50%;background:${ROLES[c].color}"></span>${ROLES[c].name}</span>`).join(' ');
}
function listBlock(title, items, cls) {
  if (!items || !items.length) return '';
  return `<div class="sc-block ${cls || ''}"><h4>${title}</h4>
    <ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
}
function monoBlock(title, items) {
  if (!items || !items.length) return '';
  return `<div class="sc-block"><h4>${title}</h4>
    <ul>${items.map(i => `<li><code>${i}</code></li>`).join('')}</ul></div>`;
}
function ucBlock(ids) {
  if (!ids || !ids.length) return '';
  return `<div class="sc-block"><h4>Use case ที่รองรับ</h4>
    <div style="display:flex;flex-wrap:wrap;gap:5px">${ids.map(id =>
      `<a class="badge badge-outline mono" href="usecase-spec.html#${id}" style="text-decoration:none">${id}</a>`).join('')}</div></div>`;
}

function screenDetail(s) {
  return `<details class="acc anchor" id="${s.id}">
    <summary><span class="sc-sum">${icon(s.icon)}
      <span class="scn">${s.name}</span>
      <span class="badge badge-outline">${s.grp}</span>

            <td>ตัวชี้วัด 8 ตัวพร้อมเป้าหมายและรอบการวัด ตารางผู้รับผิดชอบรายชั้นข้อมูล และนโยบายสำรอง/ส่งต่อฐานข้อมูล</td>

/* ---------- กลุ่มผู้ใช้งาน ---------- */
document.getElementById('roleCards').innerHTML = Object.values(ROLES).map(r => `
  <div class="card"><div class="card-body">
    <div class="row row-tight" style="margin-bottom:6px">
      <span style="width:9px;height:9px;border-radius:50%;background:${r.color}"></span>
      <strong>${r.name}</strong>
    </div>
    <div class="xsmall muted mb8">${r.en}</div>
    <p class="small dim" style="min-height:44px">${r.desc}</p>
    <div class="xsmall" style="font-weight:650;color:var(--good-ink);margin-top:6px">ทำได้</div>
    <ul class="xsmall dim" style="padding-left:16px;margin:3px 0 8px">${r.can.map(c => `<li>${c}</li>`).join('')}</ul>
    <div class="xsmall" style="font-weight:650;color:var(--critical)">ทำไม่ได้</div>
    <ul class="xsmall dim" style="padding-left:16px;margin:3px 0 0">${r.cannot.map(c => `<li>${c}</li>`).join('')}</ul>
  </div></div>`).join('');

/* ---------- รายละเอียดรายหน้าจอ ---------- */
document.getElementById('screenSections').innerHTML = GROUPS.map(g => {
  const items = SCREEN_DOCS.filter(s => s.grp === g);
  return `<div class="card mb16">
    <div class="card-head"><h2>${g}</h2><span class="spacer"></span>
      <span class="badge badge-outline">${items.length} หน้าจอ</span></div>
    <div class="card-body">${items.map(screenDetail).join('')}</div>
  </div>`;
}).join('');

document.getElementById('jumpScreens').innerHTML = SCREEN_DOCS.map(s =>
  `<a href="#${s.id}">${s.name}</a>`).join('');

/* ---------- เอกสารการออกแบบ ---------- */
document.getElementById('docCards').innerHTML = DESIGN_DOCS.map(d => `
  <a class="doccard" href="${d[0]}">
    <span class="ic">${icon(d[1])}</span>
    <h3>${d[2]}</h3><p>${d[3]}</p></a>`).join('');

/* ---------- ปุ่มเครื่องมือ ---------- */
let allOpen = false;
const btnOpen = document.getElementById('btnOpen');
btnOpen.onclick = () => {
  allOpen = !allOpen;
  document.querySelectorAll('details.acc').forEach(d => { d.open = allOpen; });
  btnOpen.innerHTML = `${icon(allOpen ? 'x' : 'plus')} ${allOpen ? 'ย่อทั้งหมด' : 'ขยายทั้งหมด'}`;
};

/* เปิดรายละเอียดของหน้าจอที่ถูกอ้างถึงด้วย # ในลิงก์จากแถบบน */
function openFromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return;
  const el = document.getElementById(id);
  if (el && el.tagName === 'DETAILS') { el.open = true; el.scrollIntoView({ block: 'start' }); }
}

/* ---------- ขอบเขตที่ต้องตกลงก่อนเริ่มงาน ---------- */
document.getElementById('scopeNote').innerHTML = `${icon('warn')}<div>
  <strong>ขอบเขตที่ต้องตกลงให้ชัดเจนก่อนเริ่มงาน</strong>
  ข้อกำหนดขอบเขตของงานฉบับที่ใช้เป็นต้นแบบระบุว่า การส่งมอบครอบคลุม <em>ฐานข้อมูลและไฟล์ส่งมอบ</em>
  โดย <em>ไม่รวม</em> การพัฒนาระบบ Web GIS และการจัดซื้อเครื่องแม่ข่าย เว้นแต่ระบุเพิ่มก่อนประกาศจ้าง
  ต้นแบบหน้าจอชุดนี้จึงมีสถานะเป็น <strong>ข้อเสนอส่วนขยาย</strong> เพื่อประกอบการพิจารณาว่าจะเพิ่มขอบเขตหรือไม่
  หากไม่เพิ่ม ข้อกำหนดเดิมยังรองรับได้ด้วยการส่งมอบ GeoPackage และโครงการ QGIS ตามหน้า
  <a href="export.html">ส่งออกและเผยแพร่</a></div>`;

window.addEventListener('hashchange', openFromHash);
openFromHash();
</script>
