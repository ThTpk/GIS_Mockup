/* ---------- ตัวช่วยนับและแสดงผล ---------- */
const UC_TOTAL   = USE_CASES.length;
const UC_WITH_UI = USE_CASES.filter(u => u.scr).length;
const UC_NO_UI   = USE_CASES.filter(u => !u.scr).length;
const PRI_BADGE  = { 'สูง': 'badge-critical', 'กลาง': 'badge-warning', 'ต่ำ': 'badge-outline' };

function actorPills(codes) {
  return codes.map(c => {
    const a = UC_ACTORS[c];
    return `<span class="badge badge-outline" title="${a.en} — ${a.desc}">
      <span style="width:7px;height:7px;border-radius:50%;background:${a.color}"></span>${a.name}</span>`;
  }).join(' ');
}

function screenCell(u) {
  if (!u.scr) return `<span class="badge badge-warning" title="${u.gap || 'ยังไม่มีหน้าจอในต้นแบบ'}">API เท่านั้น</span>`;
  if (u.scr.startsWith('(')) return `<span class="small muted">${u.scr}</span>`;
  return u.scr.split(' · ').map(f => `<a href="${f}">${f}</a>`).join(' · ');
}

function block(title, items, ordered) {
  if (!items || !items.length) return '';
  const tag = ordered ? 'ol' : 'ul';
  return `<div class="uc-block"><h4>${title}</h4>
    <${tag}>${items.map(i => `<li>${i}</li>`).join('')}</${tag}></div>`;
}

function altBlock(items) {
  if (!items || !items.length) return '';
  return `<div class="uc-block"><h4>ทางเลือกและข้อยกเว้น</h4>
    <ul>${items.map(a => `<li><b>${a[0]}</b> — ${a[1]}</li>`).join('')}</ul></div>`;
}

function ucDetail(u) {
  const g = UC_GROUPS.find(x => x.n === u.g);
  return `<details class="acc" id="${u.id}">
    <summary><span class="uc-sum">
      <span class="uid">${u.id}</span>
      <span class="unm">${u.name}</span>
      <span class="badge ${PRI_BADGE[u.pri]}">${u.pri}</span>
      ${u.scr ? '' : '<span class="badge badge-warning">API เท่านั้น</span>'}
    </span></summary>
    <div class="acc-body">
      <dl class="kv uc-meta" style="margin-bottom:13px">
        <dt>กลุ่มงาน</dt><dd>${g.n}. ${g.name}</dd>
        <dt>ผู้กระทำหลัก</dt><dd>${actorPills(u.ro)}</dd>
        <dt>ผู้กระทำร่วม</dt><dd>${u.sec}</dd>
        <dt>หน้าจอ</dt><dd>${screenCell(u)}</dd>
        <dt>API ที่เกี่ยวข้อง</dt><dd class="mono small">${u.api}</dd>
        <dt>ความถี่การใช้งาน</dt><dd>${u.freq}</dd>
        ${u.gap ? `<dt>หมายเหตุขอบเขต</dt><dd>${u.gap}</dd>` : ''}
      </dl>
      <div class="uc-grid">
        ${block('เงื่อนไขก่อนเริ่ม', u.pre)}
        ${block('เงื่อนไขหลังเสร็จ', u.post)}
        <div class="uc-block wide"><h4>ลำดับเหตุการณ์หลัก</h4>
          <ol>${u.main.map(s => `<li>${s}</li>`).join('')}</ol></div>
        ${altBlock(u.alt)}
        ${block('กฎการทำงานและมาตรฐานที่อ้างอิง', u.rule)}
      </div>
    </div>
  </details>`;
}
