/* --- ERD helper --- */
function entity(x, y, w, title, kind, cols) {
  const h = 26 + cols.length * 17 + 8;
  const rows = cols.map((c, i) => {
    const yy = y + 42 + i * 17;
    return `<text class="${c[2] ? 'pk' : 'col'}" x="${x + 11}" y="${yy}">${c[0]}</text>
            <text class="ty" x="${x + w - 11}" y="${yy}" text-anchor="end">${c[1]}</text>`;
  }).join('');
  return { h, svg: `
    <rect class="bx" x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/>
    <path class="${kind}" d="M${x} ${y + 7}a7 7 0 0 1 7-7h${w - 14}a7 7 0 0 1 7 7v19H${x}z"/>
    <text class="tt" x="${x + 11}" y="${y + 18}">${title}</text>
    ${rows}` };
}

<div class="tabpanel" data-panel="p">
  <div class="grid g2 mb16">
    <div class="card"><div class="card-head"><h2>หลักการออกแบบ 8 ข้อ</h2></div>
      <div class="card-body">
        <ol style="padding-left:18px;margin:0;font-size:.88rem">
          <li class="mb8"><b>ชุดฟิลด์มาตรฐานเดียวกันทุกชั้นข้อมูล</b> — รหัสรายการไม่ซ้ำ แหล่งข้อมูล วันที่สำรวจ
            หน่วยงานรับผิดชอบหรือสถานะรอยืนยัน และคำอธิบายข้อมูล บังคับด้วยข้อจำกัดระดับฐานข้อมูล
            ไม่ใช่ความเคยชินของผู้กรอก</li>
          <li class="mb8"><b>แยกเจ้าของทรัพย์สินกับผู้บำรุงรักษา</b> — เป็นสองฟิลด์คนละฟิลด์
            พร้อมฟิลด์สถานะการยืนยัน เพื่อให้บันทึกกรณีข้อมูลหน่วยงานไม่ตรงกันได้โดยไม่ต้องเดา</li>
          <li class="mb8"><b>จัดเก็บใน EPSG:4326 คำนวณด้วย geography</b> — ใช้ระบบพิกัดเดียวทั่วทั้งฐานข้อมูล
            ลดความผิดพลาดจากการแปลงพิกัด และคำนวณระยะ/พื้นที่บนทรงรีให้ค่าถูกต้อง</li>
          <li class="mb8"><b>ค่าคำนวณเก็บเป็น generated column</b> — ความยาวถนนและพื้นที่
            คำนวณจากรูปทรงโดยอัตโนมัติ จึงไม่มีทางไม่ตรงกับรูปทรงที่เก็บไว้</li>
          <li class="mb8"><b>ไม่ลบข้อมูลจริง</b> — ใช้สถานะ <code>retired</code> แทนการลบ
            และเก็บประวัติการเปลี่ยนแปลงทุกเวอร์ชันไว้ในสคีมา audit</li>
          <li class="mb8"><b>แยกชั้นความลับที่ระดับแถว</b> — ฟิลด์ <code>sensitivity_code</code> และ
            <code>is_public</code> ทำให้สร้างชุดเผยแพร่ได้ด้วยกฎ ไม่ใช่การคัดไฟล์ด้วยมือ</li>
          <li class="mb8"><b>ควบคุมสิทธิ์ที่ระดับฐานข้อมูล</b> — Row Level Security บังคับขอบเขตชั้นข้อมูลและพื้นที่
            จึงคุ้มครองแม้ผู้ใช้เชื่อมต่อผ่าน QGIS โดยตรง ไม่ผ่านเว็บ</li>
          <li><b>ค่ารหัสอยู่ในตารางอ้างอิง</b> — เพิ่มประเภทผิวทางหรือประเภทอุปกรณ์ใหม่ได้
            โดยไม่ต้องแก้โครงสร้างตารางหรือ deploy ระบบใหม่</li>
        </ol>
      </div></div>

      </div>
      <div class="card"><div class="card-head"><h2>ข้อจำกัดที่บังคับตามข้อกำหนดงาน</h2></div>
        <div class="card-body" style="padding-top:12px">
<pre class="code"><span class="c">-- รหัสรายการไม่ซ้ำทั้งชั้นข้อมูล</span>
<span class="k">CREATE UNIQUE INDEX</span> uq_road_code <span class="k">ON</span> gis.road (feature_code);

<span class="c">-- วันที่สำรวจต้องไม่เป็นอนาคต</span>
<span class="k">CHECK</span> (surveyed_on &lt;= <span class="k">CURRENT_DATE</span>)

<span class="c">-- ต้องระบุเจ้าของ หรือยอมรับเฉพาะเมื่อสถานะยังไม่ยืนยัน</span>
<span class="k">CHECK</span> (owner_agency_id <span class="k">IS NOT NULL</span>
    <span class="k">OR</span> confirm_status_code <span class="k">IN</span> (<span class="s">'pending'</span>,<span class="s">'conflict'</span>,<span class="s">'unknown'</span>))

<span class="c">-- ชั้นข้อมูล CCTV ต้องไม่อยู่ในชุดเผยแพร่</span>
<span class="k">CHECK</span> (is_public = <span class="k">false</span>)
<span class="k">CHECK</span> (sensitivity_code <span class="k">IN</span> (<span class="s">'confidential'</span>,<span class="s">'restricted'</span>))</pre>
        </div></div>
    </div>
  </div>
</div>

        <details class="acc" open><summary>ทำไมไม่ใช้ตารางเดียวเก็บทุกชั้นข้อมูล</summary>
          <div class="acc-body small">ตารางเดียวแบบ key-value ยืดหยุ่นกว่าแต่ตรวจค่าไม่ได้ที่ระดับฐานข้อมูล

        <details class="acc"><summary>ทำไมแยกตารางแหล่งน้ำเป็น 3 ตาราง</summary>

        <details class="acc"><summary>ทำไมบันทึกประวัติด้วย trigger ไม่ใช่โค้ดฝั่งแอปพลิเคชัน</summary>

        <details class="acc"><summary>ทำไมไม่เก็บชื่อเจ้าของที่ดินในชั้นข้อมูลเชิงพื้นที่</summary>

            โดยไม่ต้องตัดฟิลด์ทีละครั้ง และลดความเสี่ยงการรั่วไหล</div></details>
      </div>
    </div>
  </div>

<span class="c">-- เติมชุดฟิลด์มาตรฐาน 21 ฟิลด์ ดัชนี และข้อจำกัดให้อัตโนมัติ</span>

<span class="k">CREATE INDEX</span> idx_light_geom <span class="k">ON</span> gis.street_light <span class="k">USING</span> GIST (geom);</pre>

      <div class="card-body" style="padding-top:12px">
<pre class="code dark"><span class="k">SELECT</span> l.feature_code, r.feature_code <span class="k">AS</span> road_code,
       <span class="k">round</span>(<span class="t">ST_Distance</span>(l.geom::<span class="t">geography</span>,
                       r.geom::<span class="t">geography</span>)::<span class="t">numeric</span>, 1) <span class="k">AS</span> dist_m
<span class="k">FROM</span>   gis.street_light l
<span class="k">JOIN</span>   gis.road r <span class="k">ON</span> r.feature_uid = l.road_uid
<span class="k">WHERE</span>  <span class="k">NOT</span> <span class="t">ST_DWithin</span>(l.geom::<span class="t">geography</span>,
                        r.geom::<span class="t">geography</span>, <span class="n">25</span>)

<pre class="code dark"><span class="k">SELECT</span> d.feature_code,
       <span class="k">round</span>(d.area_rai, 2) <span class="k">AS</span> area_rai,
       <span class="k">count</span>(<span class="k">DISTINCT</span> p.feature_uid) <span class="k">AS</span> parcel_count,
       <span class="k">count</span>(<span class="k">DISTINCT</span> b.feature_uid) <span class="k">AS</span> building_count
<span class="k">FROM</span>   gis.boundary_discrepancy d
<span class="k">LEFT JOIN</span> gis.land_parcel p <span class="k">ON</span> <span class="t">ST_Intersects</span>(p.geom, d.geom)
<span class="k">LEFT JOIN</span> gis.building    b <span class="k">ON</span> <span class="t">ST_Intersects</span>(b.geom, d.geom)
<span class="k">GROUP BY</span> d.feature_code, d.area_rai
<span class="k">ORDER BY</span> d.area_rai <span class="k">DESC</span>;</pre>

<pre class="code dark"><span class="k">SELECT</span> <span class="t">ST_AsMVT</span>(t, <span class="s">'road'</span>, <span class="n">4096</span>, <span class="s">'geom'</span>)
<span class="k">FROM</span> (
  <span class="k">SELECT</span> feature_code, name_th, road_class_code, surface_code,
         <span class="t">ST_AsMVTGeom</span>(
           <span class="t">ST_Transform</span>(geom, <span class="n">3857</span>),
           <span class="t">ST_TileEnvelope</span>(:z, :x, :y), <span class="n">4096</span>, <span class="n">64</span>, <span class="k">true</span>) <span class="k">AS</span> geom
  <span class="k">FROM</span>   gis.road
  <span class="k">WHERE</span>  geom &amp;&amp; <span class="t">ST_Transform</span>(<span class="t">ST_TileEnvelope</span>(:z, :x, :y), <span class="n">4326</span>)
    <span class="k">AND</span>  record_status_code = <span class="s">'approved'</span>
) t;</pre>
      </div></div>
  </div>
</div>
`;
