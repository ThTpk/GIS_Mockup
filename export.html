function paintFmts() {
  document.getElementById('fmts').innerHTML = FMTS.map((f, i) => `
    <label class="fmt"><input type="checkbox" data-f="${i}" ${f[2] ? 'checked' : ''}>
      <span><span class="n">${f[0]}</span><span class="d">${f[1]}</span></span></label>`).join('');
  document.querySelectorAll('[data-f]').forEach(c => c.onchange = size);
  size();
}
function size() {
  let mb = 0;
  document.querySelectorAll('[data-f]').forEach(c => { if (c.checked) mb += FMTS[+c.dataset.f][3]; });
  document.getElementById('sz').textContent = mb > 1024 ? (mb / 1024).toFixed(2) + ' GB' : mb + ' MB';
}

function makeJob() {
  if (currentRole() === 'editor') return toast('สิทธิ์ผู้ป้อนข้อมูลส่งออกทั้งชุดไม่ได้', 'warn');
  const m = modal('กำลังสร้างชุดส่งมอบ',
    `<div class="progress" style="height:9px"><i id="pb" style="width:4%"></i></div>
     <p class="small dim mt16" id="pt">กำลังรวบรวมชั้นข้อมูล…</p>`, '');
  const steps = ['กำลังรวบรวมชั้นข้อมูล…', 'สร้าง GeoPackage…', 'สร้างโครงการ QGIS และไฟล์สัญลักษณ์…',
    'จัดหน้าแผนที่ PDF…', 'สร้างตาราง XLSX/CSV…', 'รวบรวมภาพถ่ายภาคสนาม…',
    'สร้างพจนานุกรมข้อมูลและ Metadata…', 'คำนวณค่าแฮชและสร้างบัญชีไฟล์…'];
  let i = 0;
  const t = setInterval(() => {
    i++;
    const pb = m.el.querySelector('#pb'), pt = m.el.querySelector('#pt');
    if (!pb) return clearInterval(t);
    pb.style.width = Math.min(100, i / steps.length * 100) + '%';
    pt.textContent = steps[Math.min(i, steps.length - 1)];
    if (i >= steps.length) {
      clearInterval(t); m.close();
      toast('สร้างชุดส่งมอบ GIS_Dataset_v2026.10 เรียบร้อย — ขนาด 4.82 GB', 'check');
    }
  }, 420);
}
const bg = document.getElementById('btnGo'); if (bg) bg.onclick = makeJob;
const bm = document.getElementById('btnMake'); if (bm) bm.onclick = makeJob;
