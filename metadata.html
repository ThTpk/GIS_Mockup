<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metadata ชุดข้อมูล — GeoCore GIS</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main class="content"><div class="content-inner" id="root"></div></main>

<script src="assets/js/data.js"></script>
<script src="assets/js/shell.js"></script>
<script>
renderShell('metadata.html');
const root = document.getElementById('root');

root.innerHTML = `
${pageHead({
  crumbs: ['<a href="dashboard.html">หน้าแรก</a>', '<a href="layers.html">ทะเบียนชั้นข้อมูล</a>', 'Metadata'],
  title: 'Metadata ชุดข้อมูล',
  badge: badge('ISO 19115 / มาตรฐานข้อมูลภาครัฐ', 'info'),
  sub: 'คำอธิบายชุดข้อมูล สายข้อมูล ความแม่นยำ เงื่อนไขการใช้ และรอบการปรับปรุง',
  actions: `<select id="mLayer" style="width:auto;min-height:34px"></select>
            <button class="btn" id="btnXml">${icon('code')} ส่งออก XML</button>
            <button class="btn btn-primary" data-need="write-all" id="btnEdit">${icon('pencil')} แก้ไข Metadata</button>`
})}

<div class="grid g-2-1">
  <div class="stack">
    <div class="card">
      <div class="card-head"><h2 id="mTitle">—</h2><span class="spacer"></span>
        <span class="badge badge-good">ครบถ้วน 16 / 16 รายการ</span></div>
      <div class="table-wrap">
        <table class="tbl"><tbody id="mRows"></tbody></table>
      </div>
      <div class="card-foot">ส่งออกเป็น ISO 19115 XML ได้โดยตรง ไม่ต้องจัดทำซ้ำด้วยมือ</div>
    </div>

    <div class="card">
      <div class="card-head"><h2>สายข้อมูล (Lineage)</h2><span class="spacer"></span>
        <span class="hint">ภาพที่ 3 — ที่มาและการแปลงข้อมูล</span></div>
      <div class="card-body">
        <div class="erd-scroll">
          <svg viewBox="0 0 880 210" role="img" aria-label="แผนภาพสายข้อมูลจากแหล่งต่าง ๆ ผ่านการตรวจสอบสู่ชุดส่งมอบ">
            <defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="var(--line-strong)"/></marker>
              <style>
                .b2 { fill: var(--surface-1); stroke: var(--line-strong); stroke-width: 1.2; }
                .t2 { font: 600 11.5px var(--font); fill: var(--ink-1); }
                .s2 { font: 400 10px var(--font); fill: var(--ink-3); }
                .l2 { stroke: var(--line-strong); stroke-width: 1.3; fill: none; marker-end: url(#a2); }
              </style></defs>
            <rect class="b2" x="8"   y="14"  width="168" height="40" rx="8"/>
            <text class="t2" x="22" y="32">สำรวจภาคสนาม RTK GNSS</text><text class="s2" x="22" y="46">ก.ค.–ต.ค. 2569 · ≤ 1.5 ม.</text>
            <rect class="b2" x="8"   y="62"  width="168" height="40" rx="8"/>
            <text class="t2" x="22" y="80">ภาพถ่ายทางอากาศ 2568</text><text class="s2" x="22" y="94">ดิจิไทซ์ · ≤ 3.0 ม.</text>
            <rect class="b2" x="8"   y="110" width="168" height="40" rx="8"/>
            <text class="t2" x="22" y="128">ทะเบียนทรัพย์สินหน่วยงาน</text><text class="s2" x="22" y="142">หนังสือตอบและเอกสารแนบ</text>
            <rect class="b2" x="8"   y="158" width="168" height="40" rx="8"/>
            <text class="t2" x="22" y="176">แจ้งเหตุจากประชาชน</text><text class="s2" x="22" y="190">เวทีประชาคม · แบบสำรวจออนไลน์</text>

            <rect class="b2" x="236" y="62" width="156" height="88" rx="8" fill="var(--accent-wash)" stroke="var(--accent)"/>
            <text class="t2" x="250" y="84">นำเข้าและทำให้เป็น</text><text class="t2" x="250" y="100">มาตรฐานเดียวกัน</text>
            <text class="s2" x="250" y="118">แปลงพิกัด · จับคู่ค่าโดเมน</text><text class="s2" x="250" y="132">สร้างรหัสรายการไม่ซ้ำ</text>

            <rect class="b2" x="446" y="62" width="156" height="88" rx="8"/>
            <text class="t2" x="460" y="84">ตรวจคุณภาพ 12 กฎ</text>
            <text class="s2" x="460" y="102">ความครบถ้วน · ความไม่ซ้ำ</text><text class="s2" x="460" y="116">เรขาคณิต · ความสัมพันธ์</text>
            <text class="s2" x="460" y="132">บันทึกข้อค้นพบและการแก้ไข</text>

            <rect class="b2" x="656" y="14" width="212" height="62" rx="8"/>
            <text class="t2" x="670" y="36">ฐานข้อมูลใช้งานภายใน</text>
            <text class="s2" x="670" y="52">PostGIS · ทุกชั้นข้อมูลและทุกฟิลด์</text>
            <text class="s2" x="670" y="66">มีประวัติการแก้ไขทุกเวอร์ชัน</text>

            <rect class="b2" x="656" y="92" width="212" height="62" rx="8"/>
            <text class="t2" x="670" y="114">ชุดเผยแพร่สาธารณะ</text>
            <text class="s2" x="670" y="130">ตัดชั้นข้อมูลและฟิลด์อ่อนไหว</text>
            <text class="s2" x="670" y="144">เฉพาะรายการที่อนุมัติแล้ว</text>

            <rect class="b2" x="656" y="166" width="212" height="38" rx="8"/>
            <text class="t2" x="670" y="190">ชุดส่งมอบ GeoPackage + QGIS</text>

            <path class="l2" d="M176 34 L232 92"/><path class="l2" d="M176 82 L232 100"/>
            <path class="l2" d="M176 130 L232 116"/><path class="l2" d="M176 178 L232 126"/>
            <path class="l2" d="M392 106 L442 106"/>
            <path class="l2" d="M602 96 L652 56"/><path class="l2" d="M602 116 L652 122"/>
            <path class="l2" d="M602 134 L652 182"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="stack">
    <div class="card">
      <div class="card-head"><h2>ความครบถ้วนของ Metadata รายชั้นข้อมูล</h2></div>
      <div class="card-body" id="completeness"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>มาตรฐานที่ใช้อ้างอิง</h2></div>
      <div class="table-wrap">
        <table class="tbl compact">
          <thead><tr><th>ด้าน</th><th>มาตรฐาน</th></tr></thead>
          <tbody>
            <tr><td>Metadata ภูมิสารสนเทศ</td><td class="small">ISO 19115-1:2014 / ISO 19139 (XML)</td></tr>
            <tr><td>คุณภาพข้อมูลภูมิสารสนเทศ</td><td class="small">ISO 19157:2013</td></tr>
            <tr><td>บริการแผนที่</td><td class="small">OGC WMS 1.3.0 · WFS 2.0.0 · OGC API — Features 1.0</td></tr>
            <tr><td>รูปแบบแลกเปลี่ยนข้อมูล</td><td class="small">OGC GeoPackage 1.3 · GeoJSON (RFC 7946)</td></tr>
            <tr><td>ระบบพิกัดอ้างอิง</td><td class="small">EPSG:4326 (จัดเก็บ) · EPSG:32647 (คำนวณระยะและพื้นที่)</td></tr>
            <tr><td>ความมั่นคงปลอดภัยสารสนเทศ</td><td class="small">ISO/IEC 27001:2022 · NIST CSF 2.0</td></tr>
            <tr><td>การคุ้มครองข้อมูลส่วนบุคคล</td><td class="small">พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562</td></tr>
            <tr><td>ความมั่นคงปลอดภัยแอปพลิเคชัน</td><td class="small">OWASP ASVS 4.0 · OWASP Top 10 (2021)</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>ตัวอย่างไฟล์ Metadata</h2></div>
      <div class="card-body" style="padding-top:12px">
        <div class="code-head">metadata_iso19115.xml (ตัดตอน)</div>
<pre class="code dark"><span class="t">&lt;gmd:MD_Metadata&gt;</span>
  <span class="t">&lt;gmd:fileIdentifier&gt;</span><span class="s">urn:geocore:layer:road:2026.10</span><span class="t">&lt;/gmd:fileIdentifier&gt;</span>
  <span class="t">&lt;gmd:language&gt;</span><span class="s">tha</span><span class="t">&lt;/gmd:language&gt;</span>
  <span class="t">&lt;gmd:hierarchyLevel&gt;</span><span class="s">dataset</span><span class="t">&lt;/gmd:hierarchyLevel&gt;</span>
  <span class="t">&lt;gmd:referenceSystemInfo&gt;</span><span class="s">EPSG:4326</span><span class="t">&lt;/gmd:referenceSystemInfo&gt;</span>
  <span class="t">&lt;gmd:identificationInfo&gt;</span>
    <span class="t">&lt;gmd:abstract&gt;</span><span class="s">แนวเส้นถนนทุกสายในเขตพื้นที่ …</span><span class="t">&lt;/gmd:abstract&gt;</span>
    <span class="t">&lt;gmd:spatialResolution&gt;</span><span class="n">4000</span><span class="t">&lt;/gmd:spatialResolution&gt;</span>
  <span class="t">&lt;/gmd:identificationInfo&gt;</span>
  <span class="t">&lt;gmd:dataQualityInfo&gt;</span>
    <span class="c">&lt;!-- ความแม่นยำตำแหน่งและผลการตรวจคุณภาพ --&gt;</span>
    <span class="t">&lt;gmd:lineage&gt;</span><span class="s">สำรวจภาคสนาม RTK GNSS + ดิจิไทซ์ …</span><span class="t">&lt;/gmd:lineage&gt;</span>
  <span class="t">&lt;/gmd:dataQualityInfo&gt;</span>
<span class="t">&lt;/gmd:MD_Metadata&gt;</span></pre>
      </div>
    </div>
  </div>
</div>
`;

document.getElementById('mLayer').innerHTML = LAYERS.map(l =>
  `<option value="${l.code}">${l.code} · ${l.name}</option>`).join('');

function paintMeta() {
  const code = document.getElementById('mLayer').value;
  const l = LAYERS.find(x => x.code === code);
  document.getElementById('mTitle').textContent = `${l.code} · ${l.name}`;
  const rows = META_FIELDS.map(f => {
    let v = f.v;
    if (f.k.startsWith('ชื่อชุดข้อมูล')) v = `ชั้นข้อมูล${l.name}`;
    if (f.k.startsWith('รหัสชุดข้อมูล')) v = `${l.code} · urn:geocore:layer:${l.en.toLowerCase().replace(/[^a-z]+/g, '_')}:2026.10`;
    if (f.k.startsWith('บทคัดย่อ')) v = l.note;
    if (f.k.startsWith('รูปแบบการส่งมอบ')) v = 'GeoPackage · QGIS Project · GeoJSON · XLSX/CSV · PDF Map';
    if (f.k.startsWith('รุ่นข้อมูล')) v = `v2026.10 (ปรับปรุง ${l.updated})`;
    if (f.k.startsWith('ชั้นความลับ') && l.code === 'L03')
      v = 'Confidential — ตัดออกจากชุดเผยแพร่สาธารณะทุกรุ่น ไม่จัดเก็บรหัสผ่านหรือข้อมูลเชื่อมต่อ';
    return `<tr><td style="width:230px;font-weight:600;background:var(--surface-2)">${f.k}</td><td>${v}</td></tr>`;
  }).join('');
  document.getElementById('mRows').innerHTML = rows;
}
document.getElementById('mLayer').addEventListener('change', paintMeta);
paintMeta();

document.getElementById('completeness').innerHTML = barChart(
  LAYERS.map(l => ({ label: `${l.code} ${l.name}`, value: l.code === 'L05' ? 88 : l.code === 'L06' ? 94 : 100,
    color: l.code === 'L05' ? 'var(--s4)' : l.code === 'L06' ? 'var(--s4)' : 'var(--s3)' })), '%')
  + `<p class="small muted mt16" style="margin-bottom:0">ชั้นข้อมูล L05 และ L06 ยังขาดรายการสายข้อมูลและความแม่นยำบางส่วน
     ระบบจะไม่อนุญาตให้สร้างชุดส่งมอบขั้นสุดท้ายจนกว่า Metadata จะครบทุกชั้นข้อมูล</p>`;

document.getElementById('btnXml').onclick = () => toast('ส่งออก Metadata เป็น ISO 19139 XML ครบทั้ง 10 ชั้นข้อมูล', 'code');
const be = document.getElementById('btnEdit');
if (be) be.onclick = () => toast('เปิดฟอร์มแก้ไข Metadata — บันทึกเป็นเวอร์ชันใหม่พร้อมผู้แก้ไขและเวลา', 'pencil');
</script>
</body>
</html>
