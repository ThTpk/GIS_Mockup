  return `<div class="stat">
    <div class="lbl">${k.name}</div>
    <div class="val num">${k.value}<span style="font-size:.9rem;font-weight:500;color:var(--ink-3)"> ${k.unit}</span></div>
    <div class="foot">เป้าหมาย ${k.target} ${k.unit} ·
      <span class="${(k.code === 'KPI-03' || k.code === 'KPI-04') ? (k.trend < 0 ? 'delta-up' : 'delta-down') : (k.trend >= 0 ? 'delta-up' : 'delta-down')}">
      ${k.trend > 0 ? '+' : ''}${k.trend}</span></div>
    <div class="progress mt8"><i style="width:${pct}%;background:${good ? 'var(--good)' : 'var(--warning)'}"></i></div>
  </div>`;
}).join('');

document.getElementById('kpiRows').innerHTML = KPIS.map(k => {
  const pct = k.unit === '%' ? k.value : (k.target ? Math.min(100, k.target ? (k.code === 'KPI-03' || k.code === 'KPI-04'
    ? (k.value <= k.target ? 100 : Math.max(0, 100 - (k.value - k.target) / Math.max(k.target, 1) * 100))
    : k.value / k.target * 100) : 0) : 0);
  const good = (k.code === 'KPI-03' || k.code === 'KPI-04') ? k.value <= k.target : k.value >= k.target * .95;
  return `<tr>
    <td class="mono">${k.code}</td><td>${k.name}</td>
    <td class="num"><b>${k.value}</b> ${k.unit}</td><td class="num">${k.target} ${k.unit}</td>
    <td><div class="progress"><i style="width:${pct.toFixed(0)}%;background:${good ? 'var(--good)' : 'var(--warning)'}"></i></div>
      <span class="xsmall num muted">${pct.toFixed(0)}%</span></td>
    <td class="num"><span class="${(k.code === 'KPI-03' || k.code === 'KPI-04') ? (k.trend < 0 ? 'delta-up' : k.trend > 0 ? 'delta-down' : 'muted') : (k.trend > 0 ? 'delta-up' : k.trend < 0 ? 'delta-down' : 'muted')}">
      ${k.trend > 0 ? '+' : ''}${k.trend}</span></td>
    <td class="small">${k.cycle}</td><td class="small">${k.owner}</td></tr>`;
}).join('');

document.getElementById('trend1').innerHTML = lineChart([{
  color: 'var(--s1)',
  points: [{ t: 'มิ.ย.', v: 72 }, { t: 'ก.ค.', v: 81 }, { t: 'ส.ค.', v: 88 },
           { t: 'ก.ย.', v: 93 }, { t: 'ต.ค.', v: 97.4 }]
}], { min: 60, max: 100, aria: 'ความครบถ้วนของฟิลด์บังคับรายเดือน' })
  + `<p class="small muted mt8" style="margin-bottom:0">ความครบถ้วนของฟิลด์บังคับ (%) · เป้าหมาย 100%</p>`;

document.getElementById('trend2').innerHTML = lineChart([{
  color: 'var(--s3)',
  points: [{ t: 'มิ.ย.', v: 58 }, { t: 'ก.ค.', v: 66 }, { t: 'ส.ค.', v: 78 },
           { t: 'ก.ย.', v: 87.1 }, { t: 'ต.ค.', v: 91.2 }]
}], { min: 50, max: 100, aria: 'สัดส่วนรายการที่ยืนยันเจ้าของแล้วรายเดือน' })
  + `<p class="small muted mt8" style="margin-bottom:0">สัดส่วนรายการที่ยืนยันเจ้าของทรัพย์สินแล้ว (%) ·
     คงเหลือ 147 รายการสถานะ "รอยืนยัน"</p>`;

document.getElementById('btnRep').onclick = () => toast('สร้างรายงานติดตามผลรายเดือน พร้อมกราฟและข้อเสนอแนะ', 'file');
const bv = document.getElementById('btnVal');
if (bv) bv.onclick = () => toast('บันทึกค่าตัวชี้วัดรอบใหม่ — ค่าที่คำนวณจากฐานข้อมูลจะเติมให้อัตโนมัติ', 'plus');
</script>
